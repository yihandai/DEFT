# experiment id
# name: VLNBERT-train-Surrogate_2
name: VLNBERT-train-Surrogate_NavGPT_val_24vp
vlnbert: prevalent

aug: data/prevalent/surrogate_data.json
test_only: 0

train: surrogate 

features: places365_24vp
maxAction: 15
batchSize: 8
feedback: surrogate
lr: 1e-5
iters: 300000
optim: adamW

ml_weight: 0.20
maxInput: 80
angle_feat_size: 128
featdropout: 0.4
dropout: 0.5

training_set_custom: surrogate10_navgpt
val_set_custom: val72_navgpt
load: snap/VLNBERT-PREVALENT-final/state_dict/pretrained

expert_policy: ndtw

# Panoramic view configuration for NavGPT surrogate model
panoramic_horizontal_views: 8
vfov: 45
